replicaCount: 2
revisionHistoryLimit: 3
commonLabels: {}
commonAnnotations: {}
podLabels: {}
podAnnotations: {}
image:
  repository: ghcr.io/saimudunuri04/visual-defect-service
  tag: "cb29fbd21c0c2d97883f10383698933f5bc99304"
  pullPolicy: IfNotPresent
imagePullSecrets: []
serviceAccount:
  create: true
  name: ""
  annotations: {}
service:
  type: ClusterIP
  port: 8000
  annotations: {}
containerPort: 8000
rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0
termination:
  gracePeriodSeconds: 45
  preStopSleepSeconds: 5
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi
probes:
  startup:
    httpGet:
      path: /health/live
      port: http
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    httpGet:
      path: /health/ready
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
  liveness:
    httpGet:
      path: /health/live
      port: http
    periodSeconds: 20
    timeoutSeconds: 5
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
pdb:
  enabled: true
  minAvailable: 1
networkPolicy:
  enabled: false
  ingressFrom:
    - podSelector: {}
  egressTo: []
env: {}
envFromSecretName: ""
volumeMounts: []
volumes: []

## Non-sensitive app configuration rendered into the <release>-config ConfigMap
## and injected as container environment. The FastAPI app reads each key with
## os.getenv. Keep secrets here OUT — reference them via envFromSecretName.
appEnv:
  MODEL_PATH: "/models/vision-model.pt"

## Uncomment and tune only if you ship a GPU image variant (e.g. NVIDIA device
## plugin present on the nodes). The published CPU image does not need these.
## nodeSelector:
##   nvidia.com/gpu.present: "true"
## tolerations:
##   - key: nvidia.com/gpu
##     operator: Exists
##     effect: NoSchedule
