[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sai-visual-defect-service"
version = "0.1.0"
description = "Visual defect classification: PyTorch transfer learning and image inference"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3", "torchvision>=0.17,<1", "Pillow>=10,<13", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
aws = ["sagemaker>=2.240,<3", "boto3>=1.35,<2"]

[tool.setuptools.packages.find]
where = ["src"]
